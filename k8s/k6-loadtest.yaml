apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
data:
  loadtest.js: |
    import http from 'k6/http';
    import { sleep, check } from 'k6';

    export const options = {
      vus: 50,
      duration: '60s',
    };

    export default function () {
      const response = http.get('http://gateway:5000/summary');

      check(response, {
        'status is 200': (r) => r.status === 200,
      });

      sleep(0.2);
    }

---
apiVersion: v1
kind: Pod
metadata:
  name: k6
spec:
  restartPolicy: Never

  containers:
    - name: k6
      image: grafana/k6:latest

      volumeMounts:
        - name: k6-script
          mountPath: /scripts

      command:
        - k6
        - run
        - /scripts/loadtest.js

  volumes:
    - name: k6-script
      configMap:
        name: k6-script