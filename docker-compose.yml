version: "3.9"

services:
  user-service:
    build: ./services/user-service
    ports:
      - "5001:5001"

  order-service:
    build: ./services/order-service
    ports:
      - "5002:5002"

  gateway:
    build: ./services/gateway
    ports:
      - "5000:5000"
    depends_on:
      - user-service
      - order-service